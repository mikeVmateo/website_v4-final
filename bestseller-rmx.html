<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mike Mateo</title>
    <meta name="description" content="Digital aesthetics - Experimental sound design.">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <link href='https://fonts.googleapis.com/css?family=Bebas Neue' rel='stylesheet'>
</head>
<body>
    <div id="app-layout">
        <img src="logo.png" id="mobile-toggle" alt="Menu">
        <nav id="sidebar">
            <img src="logo.png" alt="Logo Mike Mateo" class="sidebar-logo">
            <ul class="project-list">
    <li><a href="index.html" class="inactive">If You Really (-) Me Too</a></li>
    <li><a href="bestseller-rmx.html" class="active">BESTSELLER [RMX]</a></li>
    <li><a href="tears-plui.html" class="inactive">tears plui</a></li>
    <li><a href="shenmue-x-sbt.html" class="inactive">SHENMUE x SBT</a></li>
    <li><a href="sickospiral.html" class="inactive">Sickospiral</a></li>
</ul>
            <div class="sidebar-footer">
                <p>Digital aesthetics</p><p>Experimental sound design & music</p>
            </div>
        </nav>
        <main id="main-content">
            <div id="canvas-container"></div>
            <div id="remix-interface">
                <div class="track-controls">
                    <button id="btn-track1" class="remix-btn active-btn" onclick="playTrack(1)">BESTSELLER [RMX]</button>
                    <button id="btn-track2" class="remix-btn" onclick="playTrack(2)">BESTSELLER [INSTRU]</button>
                    <button id="btn-track3" class="remix-btn" onclick="playTrack(3)">[DRUMZZZONLY]</button>
                </div>
                <div class="parameter-controls">
                    <div class="slider-group">
                        <label for="point-size">/pointSize</label>
                        <input type="range" id="point-size" min="1" max="8" step="0.5" value="2">
                    </div>
                    <div class="slider-group">
                        <label for="noise-intensity">/distortion</label>
                        <input type="range" id="noise-intensity" min="0" max="5" step="0.1" value="0">
                    </div>
                    <div class="slider-group">
                        <label for="extrusion-force">/ex-force</label>
                        <input type="range" id="extrusion-force" min="1" max="15" step="0.5" value="5">
                    </div>
                    <div class="effect-controls">
                    <div class="checkbox-group">
                        <input type="checkbox" id="effect-pulsation">
                        <label for="effect-pulsation">/pulse</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="effect-ripple">
                        <label for="effect-ripple">/.wav</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="effect-displacement">
                        <label for="effect-displacement">/.noise</label>
                    </div>
                </div>
                </div>
            </div>
            <audio id="remix-audio" loop></audio>
        </main>
    </div>

    <script>window.CURRENT_TRACK_PATH = 'tracks/remix-data/';</script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="app_remix.js"></script>

    <script>
        const mobileToggle = document.getElementById('mobile-toggle');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('main-content');
        mobileToggle.addEventListener('click', () => sidebar.classList.toggle('open'));
        mainContent.addEventListener('click', () => { if (sidebar.classList.contains('open')) sidebar.classList.remove('open'); });
    </script>
    <script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
