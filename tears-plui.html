<body>

                <p>Digital aesthetics</p><p>Experimental sound design & music</p>
            </div>
        </nav>
        <main id="main-content">
            <div id="canvas-container"></div>
            <div id="overlay"><button id="play-button">PLAY</button></div>
            <div id="custom-player">
                <button id="toggle-play" onclick="togglePlay()">PAUSE</button>
                <button onclick="skip(10)">+10s</button>
                <div id="progress-container" onclick="seek(event)"><div id="progress-bar"></div></div>
            </div>
            <audio id="bg-audio" loop><source src="tracks/tears-plui/audio_archive.mp3" type="audio/mpeg"></audio>
        </main>
    </div>

    <script>window.CURRENT_TRACK_PATH = 'tracks/tears-plui/';</script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="app.js"></script>
    <script>
        const audio = document.getElementById('bg-audio');
        const overlay = document.getElementById('overlay');
        const playBtn = document.getElementById('play-button');
        const toggleBtn = document.getElementById('toggle-play');
        const progressBar = document.getElementById('progress-bar');
        playBtn.addEventListener('click', () => { audio.play(); overlay.style.opacity = '0'; setTimeout(() => overlay.style.display = 'none', 500); document.getElementById('custom-player').style.display = 'flex'; });
        function togglePlay() { if (audio.paused) { audio.play(); toggleBtn.innerText = "PAUSE"; } else { audio.pause(); toggleBtn.innerText = "PLAY"; } }
        function skip(time) { audio.currentTime += time; }
        audio.addEventListener('timeupdate', () => { progressBar.style.width = ((audio.currentTime / audio.duration) * 100) + '%'; });
        function seek(event) { const container = document.getElementById('progress-container'); const pos = (event.clientX - container.getBoundingClientRect().left) / container.offsetWidth; audio.currentTime = pos * audio.duration; }
        document.getElementById('mobile-toggle').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
        document.getElementById('main-content').addEventListener('click', () => document.getElementById('sidebar').classList.remove('open'));
    </script>
    <script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
